[package]
name = "tuitris"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true 
codegen-units = 1
panic = "abort"
strip = true